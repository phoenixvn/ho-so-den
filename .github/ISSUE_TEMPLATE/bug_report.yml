name: Bug report / Báo lỗi
description: Report a reproducible software issue using fictional data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include private records, credentials or real identifying case data. Security reports belong in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, viewport, Docker/Node version, local or hosted preview.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no private case data, credentials or personal identifying information.
          required: true
