# Self-hostable PREVIEW only: no database, uploads, accounts or community sync yet.
services:
  preview:
    build: .
    image: ho-so-den:0.1.0-alpha.2
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8080}:8080"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped
